services:
  api:
    build: .
    container_name: coremart-api
    command: npm start
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - database
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: coremart-worker
    command: npm run worker
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  database:
    image: postgres:16
    container_name: coremart-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: coremart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data: